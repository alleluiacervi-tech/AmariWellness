# Calls the live site's /api/cron/tick every 5 minutes: expires unpaid
# holds, marks no-shows, completes finished sessions and sends the
# 24-hour and 2-hour reminders (src/server/jobs/tick.ts). Vercel's Hobby
# plan only allows a daily cron, and this repository is public, so
# GitHub Actions minutes for it are free.
#
# Needs, in the repository's Settings → Secrets and variables → Actions:
# - secret   CRON_SECRET: the same value as CRON_SECRET in Vercel (Production)
# - variable TICK_URL:    https://<the live domain>/api/cron/tick
# Until both are set, each run skips quietly instead of failing.
#
# GitHub may start a scheduled run a few minutes late when it's busy, and
# pauses the schedule after 60 days without any activity in the repo.
# "Run workflow" on the Actions tab calls it once by hand.
name: Scheduled jobs

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scheduled-jobs
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/cron/tick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TICK_URL: ${{ vars.TICK_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$TICK_URL" ]; then
            echo "::notice::CRON_SECRET (secret) or TICK_URL (variable) isn't set yet, so there's nothing to call."
            exit 0
          fi
          # A job that failed answers 500, which fails this run, so GitHub's
          # failure email is the alert. The body says which job and why.
          curl --silent --show-error --fail-with-body --max-time 120 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" "$TICK_URL"
